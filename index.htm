<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f7f8fa" />
  <title>Cold Chain Monitor</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#" data-page="overview" aria-label="Cold Chain Monitor home">
        <span class="brand-mark">CC</span>
        <span><strong>Cold Chain</strong><small>Shipment Monitor</small></span>
      </a>
      <div class="nav-label">WORKSPACE</div>
      <nav class="nav">
        <button class="nav-item active" data-page="overview"><span class="nav-icon">▦</span> Overview</button>
        <button class="nav-item" data-page="shipments"><span class="nav-icon">▤</span> Shipments</button>
        <button class="nav-item" data-page="evaluation"><span class="nav-icon">✓</span> Evaluation</button>
        <button class="nav-item" data-page="data"><span class="nav-icon">⇧</span> Data &amp; Export</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="env-dot"></div>
        <div><strong>Demo environment</strong><small>Synthetic data only</small></div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="mobile-menu" id="mobile-menu" aria-label="Open navigation">☰</button>
        <div class="breadcrumb">Operations <span>/</span> <strong id="breadcrumb-current">Overview</strong></div>
        <div class="topbar-right">
          <span class="api-status"><span class="status-dot" id="api-dot"></span><span id="api-status-text">Connecting…</span></span>
          <div class="avatar">OP</div>
        </div>
      </header>
      <div class="content" id="content">
        <div class="loading-state">Loading Cold Chain Monitor…</div>
      </div>
      <footer>Cold Chain Monitor <span>•</span> Local demo <span>•</span> Decisions are rule-based</footer>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/app.js" defer></script>
</body>
</html>
